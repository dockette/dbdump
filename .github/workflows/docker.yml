name: "Docker"

on:
  workflow_dispatch:

  push:
    branches: ["master"]

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        include:
          - item: mariadb-10-2
          - item: mariadb-10-4
          - item: mariadb-10-5
          - item: mariadb-10-6
          - item: mariadb-10-11
          - item: mariadb-11-1
          - item: mariadb-11-2
          - item: mariadb-11-4
          - item: mariadb-11-5
          - item: mariadb-11-7
          - item: mariadb-11-8
          - item: mariadb-12-3
          - item: mariadb-13-0

      fail-fast: false

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build image"
        uses: docker/build-push-action@v6
        with:
          context: "${{ matrix.item }}"
          load: true
          tags: "dockette/dbdump:${{ matrix.item }}"

      - name: "Test image"
        run: "make test DOCKER_VERSION=${{ matrix.item }} DOCKER_TAG=${{ matrix.item }}"

  build:
    name: "Build"
    needs: ["test"]
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/docker.yml@master
    secrets: inherit
    with:
      image: "dockette/dbdump"
      tag: "${{ matrix.item }}"
      context: "${{ matrix.item }}"
    strategy:
      matrix:
        include:
          - item: mariadb-10-2
          - item: mariadb-10-4
          - item: mariadb-10-5
          - item: mariadb-10-6
          - item: mariadb-10-11
          - item: mariadb-11-1
          - item: mariadb-11-2
          - item: mariadb-11-4
          - item: mariadb-11-5
          - item: mariadb-11-7
          - item: mariadb-11-8

      fail-fast: false

  docs:
    name: "Docs"
    runs-on: "ubuntu-latest"
    needs: ["build"]
    if: github.ref == 'refs/heads/master'

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Update Docker Hub description"
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: "dockette/dbdump"
